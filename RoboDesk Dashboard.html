<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoboDesk Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf2fb;--card:rgba(255,255,255,.72);--ink:#0b1d33;--mut:#5a6f8a;--line:rgba(0,120,170,.3);--acc:#0088c7;--acc2:#7a3dff;--soft:rgba(0,136,199,.09);--ok:#0a9f6a;--warn:#d98a00;--bad:#e0264b;--scr:#02040a;--eye:#7ff3ff;--on:#fff;--gl:0 0 16px rgba(0,136,199,.25);--grid:rgba(0,100,160,.07);--stripe:rgba(234,242,251,.95);--o1:rgba(122,61,255,.14);--o2:rgba(0,136,199,.16);
--hd:Orbitron,"Segoe UI",system-ui,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050814;--card:rgba(14,20,44,.62);--ink:#e6f1ff;--mut:#7f8fb8;--line:rgba(0,229,255,.22);--acc:#00e5ff;--acc2:#a66bff;--soft:rgba(0,229,255,.09);--ok:#2dffb0;--warn:#ffb020;--bad:#ff4d6d;--on:#02121c;--gl:0 0 18px rgba(0,229,255,.38);--grid:rgba(0,229,255,.05);--stripe:rgba(5,8,20,.9);--o1:rgba(166,107,255,.22);--o2:rgba(0,229,255,.15)}}
:root[data-theme="dark"]{--bg:#050814;--card:rgba(14,20,44,.62);--ink:#e6f1ff;--mut:#7f8fb8;--line:rgba(0,229,255,.22);--acc:#00e5ff;--acc2:#a66bff;--soft:rgba(0,229,255,.09);--ok:#2dffb0;--warn:#ffb020;--bad:#ff4d6d;--on:#02121c;--gl:0 0 18px rgba(0,229,255,.38);--grid:rgba(0,229,255,.05);--stripe:rgba(5,8,20,.9);--o1:rgba(166,107,255,.22);--o2:rgba(0,229,255,.15)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.45 Rajdhani,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(640px 420px at 88% -8%,var(--o1),transparent),radial-gradient(700px 500px at 0% 100%,var(--o2),transparent),linear-gradient(var(--grid) 1px,transparent 1px) 0 0/42px 42px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/42px 42px;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{background-position:-40px 30px,30px -20px,0 0,0 0}}
aside{width:228px;padding:22px 14px;border-right:1px solid var(--line);background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:11px;font:700 15px var(--hd);letter-spacing:.14em;margin:0 8px 18px}
.logo i{width:38px;height:38px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-style:normal;color:var(--on);font-size:12px;filter:drop-shadow(0 0 8px var(--acc))}
.nav{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:4px;color:var(--mut);cursor:pointer;border:0;background:none;font:600 16px Rajdhani,sans-serif;letter-spacing:.04em;text-align:left;width:100%;white-space:nowrap;transition:.2s}
.nav:hover{background:var(--soft);color:var(--ink)}.nav.on{background:linear-gradient(90deg,var(--soft),transparent);color:var(--acc);box-shadow:inset 2px 0 0 var(--acc);text-shadow:0 0 12px var(--acc)}
.foot{margin-top:auto;font:11px var(--mono);color:var(--mut);padding:8px;letter-spacing:.04em}
main{flex:1;padding:26px 30px 90px;max-width:1220px;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line);position:relative}
header::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:120px;background:linear-gradient(90deg,var(--acc),transparent);box-shadow:var(--gl);animation:sc 4s ease-in-out infinite alternate}@keyframes sc{to{width:320px}}
h1{font:700 22px var(--hd);letter-spacing:.05em;background:linear-gradient(90deg,var(--ink),var(--acc));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.sub{color:var(--mut);font-size:15px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:3px;background:var(--soft);border:1px solid var(--line);font:600 13px var(--mono);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pu 2s infinite}.dot.w{background:var(--warn);box-shadow:0 0 8px var(--warn)}.dot.b{background:var(--bad);box-shadow:0 0 8px var(--bad)}@keyframes pu{50%{opacity:.35}}
.btn{border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:8px 15px;border-radius:4px;font:600 15px Rajdhani,sans-serif;letter-spacing:.05em;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--acc);color:var(--acc);box-shadow:var(--gl)}.btn.p{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:var(--on);font-weight:700;box-shadow:var(--gl)}.btn.p:hover{color:var(--on);filter:brightness(1.12)}
.btn.d{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}.btn.d:hover{background:var(--bad);color:#fff;border-color:var(--bad);box-shadow:0 0 16px var(--bad)}
.view{display:none}.view.on{display:block}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:6px;padding:20px;min-width:0;position:relative;animation:up .55s both}
.card::before,.card::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;border:2px solid var(--acc);filter:drop-shadow(0 0 4px var(--acc))}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.grid>:nth-child(2){animation-delay:.06s}.grid>:nth-child(3){animation-delay:.12s}.grid>:nth-child(4){animation-delay:.18s}.grid>:nth-child(n+5){animation-delay:.24s}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
h3{font:700 12px var(--hd);color:var(--acc);margin-bottom:14px;text-transform:uppercase;letter-spacing:.16em;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-left:12px;position:relative;text-shadow:0 0 10px color-mix(in srgb,var(--acc) 55%,transparent)}
h3::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;background:var(--acc);box-shadow:var(--gl)}
.screen{width:100%;max-width:390px;margin:0 auto 16px;aspect-ratio:2/1;background:radial-gradient(circle at 50% 40%,#0a1530,var(--scr));border-radius:14px;border:7px solid #0c1233;outline:1px solid var(--acc);display:flex;align-items:center;justify-content:center;gap:15%;position:relative;overflow:hidden;box-shadow:0 0 34px color-mix(in srgb,var(--acc) 30%,transparent),inset 0 0 50px #00e5ff22}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0006 0 1px,transparent 1px 3px)}
.screen::before{content:"";position:absolute;left:0;right:0;height:30%;top:-30%;background:linear-gradient(transparent,#00e5ff22,transparent);animation:sw 4.5s linear infinite;pointer-events:none}@keyframes sw{to{top:130%}}
.eye{width:17%;aspect-ratio:1/1.15;background:var(--eye);border-radius:34%;position:relative;overflow:hidden;transition:all .35s cubic-bezier(.4,1.4,.6,1);box-shadow:0 0 26px #7ff3ffaa,0 0 60px #7ff3ff55;animation:bl 5s infinite}
.eye::before,.eye::after{content:"";position:absolute;left:-10%;width:120%;background:var(--scr);transition:all .3s}
.eye::before{top:0;height:var(--lt,0%)}.eye::after{bottom:0;height:var(--lb,0%)}
@keyframes bl{0%,94%,100%{transform:var(--t,none) scaleY(1)}97%{transform:var(--t,none) scaleY(.08)}}
.mouth{position:absolute;bottom:10%;width:14%;height:6%;border-bottom:3px solid var(--eye);border-radius:0 0 50% 50%;opacity:0;filter:drop-shadow(0 0 6px var(--eye))}
.talk .mouth{opacity:1;animation:tk .35s infinite alternate}@keyframes tk{to{height:12%}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:4px 12px;border-radius:3px;border:1px solid var(--line);background:none;color:var(--ink);font:600 14px Rajdhani,sans-serif;letter-spacing:.04em;cursor:pointer;transition:.2s}
.chip:hover,.chip.on{background:var(--soft);border-color:var(--acc);color:var(--acc);box-shadow:var(--gl)}
.meter{height:9px;background:var(--soft);border:1px solid var(--line);border-radius:2px;overflow:hidden;margin:5px 0 13px;position:relative}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:var(--gl);transition:width .8s}
.meter::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 7px,var(--stripe) 7px 9px)}
.ml{display:flex;justify-content:space-between;font-size:14px}.ml span:last-child{font-family:var(--mono);color:var(--acc);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line)}.row:last-child{border:0}
.row small{display:block;color:var(--mut);font-size:13px;line-height:1.3;font-weight:500}.row .v{color:var(--acc);font:600 13px var(--mono);text-align:right}
.sw{position:relative;width:46px;height:24px;flex:none}.sw input{opacity:0;position:absolute;inset:0;cursor:pointer;z-index:1;width:100%;height:100%}
.sw span{position:absolute;inset:0;background:var(--soft);border:1px solid var(--line);border-radius:3px;transition:.25s}.sw span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;background:var(--mut);border-radius:2px;transition:.25s}
.sw input:checked+span{background:color-mix(in srgb,var(--acc) 28%,transparent);border-color:var(--acc);box-shadow:var(--gl)}.sw input:checked+span::after{left:25px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.rgw{display:flex;gap:10px;align-items:center}.rgw b{font:600 12px var(--mono);color:var(--acc);min-width:48px;text-align:right}input[type=range]{accent-color:var(--acc);width:140px}
select,input[type=text],input[type=password]{background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font:600 14px Rajdhani,sans-serif;max-width:190px}select option{background:var(--bg)}
select:focus,input:focus{outline:0;border-color:var(--acc);box-shadow:var(--gl)}
.seg{display:flex;background:var(--soft);border-radius:4px;padding:2px;border:1px solid var(--line)}
.seg button{border:0;background:none;color:var(--mut);padding:4px 11px;border-radius:3px;font:600 13.5px Rajdhani,sans-serif;letter-spacing:.04em;cursor:pointer;transition:.2s}.seg button.on{background:var(--acc);color:var(--on);font-weight:700;box-shadow:var(--gl)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tiles>div{background:var(--soft);border:1px solid var(--line);border-left:2px solid var(--acc);border-radius:4px;padding:10px 13px}.tiles small{color:var(--mut);display:block;font-size:13px}.tiles b{font:700 15px var(--hd);letter-spacing:.03em}
.log{font:12px/1.85 var(--mono);color:var(--mut);max-height:200px;overflow:auto}.log em{color:var(--acc);font-style:normal}.log div::before{content:"› ";color:var(--acc)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.eq{display:flex;gap:3px;align-items:flex-end;height:60px;margin-top:16px}.eq i{flex:1;background:linear-gradient(var(--acc),var(--acc2));border-radius:1px;height:6%;transition:height .12s;box-shadow:0 0 8px var(--acc)}
.net{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}.net:last-child{border:0}.net .n{flex:1}.net small{color:var(--mut);display:block;font-size:13px}
.net .no{width:26px;height:26px;border-radius:3px;border:1px solid var(--acc);color:var(--acc);display:grid;place-items:center;font:700 12px var(--hd)}
.mem{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--soft);border:1px solid var(--line);border-left:2px solid var(--acc2);border-radius:4px;margin-bottom:8px;font-size:15px}.mem span{flex:1}.mem small{color:var(--mut)}.mem button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px}.mem button:hover{color:var(--bad)}
svg.ch{width:100%;height:110px;filter:drop-shadow(0 0 5px var(--acc))}
.bar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--acc);color:var(--ink);padding:9px 12px 9px 18px;border-radius:6px;display:flex;gap:12px;align-items:center;transition:.3s;z-index:8;box-shadow:var(--gl),0 14px 34px #0005;font-size:15px}.bar.s{transform:translate(-50%,0)}
.bar .btn{padding:5px 12px;font-size:14px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-80px);background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:var(--ink);border:1px solid var(--acc);padding:9px 20px;border-radius:4px;opacity:0;transition:.3s;pointer-events:none;z-index:10;font:600 15px Rajdhani,sans-serif;box-shadow:var(--gl)}.toast.s{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#02050dcc;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;place-items:center;z-index:12}.modal.s{display:grid}.modal>div{background:var(--bg);border:1px solid var(--acc);box-shadow:var(--gl);padding:24px;border-radius:6px;width:min(340px,90%);display:grid;gap:12px}.modal input{max-width:none}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
@media(max-width:900px){aside{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;width:100%;flex-direction:row;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);z-index:5}
.logo,.foot{display:none}.nav{flex-direction:column;gap:0;font-size:12px;align-items:center;padding:6px 10px;width:auto;flex:none}.nav.on{box-shadow:inset 0 2px 0 var(--acc)}
main{padding:18px 14px 110px}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}.bar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}::selection{background:var(--acc);color:var(--on)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px}
.card{transition:border-color .3s,box-shadow .3s}.card:hover{border-color:color-mix(in srgb,var(--acc) 60%,transparent);box-shadow:0 0 28px color-mix(in srgb,var(--acc) 12%,transparent)}
.btn:active,.chip:active{transform:translateY(1px) scale(.97)}
h3 .pill,h3 .btn{text-transform:none;letter-spacing:.04em;text-shadow:none;font-weight:600}
.row{flex-wrap:wrap}.row>div:first-child{flex:1 1 130px;min-width:0}.row>:last-child{margin-left:auto}
.tiles small{font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;margin-bottom:2px}.tiles b{overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.row .v,.rgw b,.ml span:last-child,.log{font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--acc) var(--p,50%),var(--line) var(--p,50%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:0;background:var(--bg);border:2px solid var(--acc);border-radius:50%;box-shadow:var(--gl)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;background:var(--bg);border:2px solid var(--acc);border-radius:50%;box-shadow:var(--gl)}
.nav svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav.on svg{filter:drop-shadow(0 0 5px var(--acc))}
.logo span{font-size:15px}.foot::before{content:"";display:block;height:1px;background:linear-gradient(90deg,var(--acc),transparent);margin-bottom:10px}
#boot{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;pointer-events:none;animation:bo .5s 1.1s forwards}
#boot>div{display:grid;gap:14px;justify-items:center;font:600 11px var(--mono);letter-spacing:.3em;color:var(--acc)}
#boot .hx{width:64px;height:64px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(135deg,var(--acc),var(--acc2));filter:drop-shadow(0 0 14px var(--acc));animation:pu 1s infinite}
#boot .ln{width:180px;height:2px;background:var(--line);overflow:hidden}#boot .ln i{display:block;height:100%;background:var(--acc);box-shadow:var(--gl);animation:ld 1.1s ease-out forwards}
@keyframes bo{to{opacity:0;visibility:hidden}}@keyframes ld{from{width:0}to{width:100%}}
@media(prefers-reduced-motion:reduce){#boot{display:none}}
</style></head><body>
<div id="boot"><div><span class="hx"></span><span class="ln"><i></i></span>INISIALISASI ROBODESK</div></div>
<aside><div class="logo"><i>◕‿◕</i><span>ROBO<b style="color:var(--acc)">DESK</b></span></div><div id="nav" style="display:contents"></div><div class="foot">v0.15.0-dev · SONIC CHARACTER<br>ESP32-S3 N16R8</div></aside>
<main>
<header><div><h1 id="ttl"></h1><div class="sub" id="sub"></div></div>
<div class="acts" style="align-items:center"><span class="pill" id="clk"></span><span class="pill"><span class="dot"></span>ONLINE · 192.168.1.42</span><button class="btn" id="theme">◐ Tema</button></div></header>
<div id="views"></div></main>
<div class="bar" id="bar"><span>Ada perubahan belum disimpan</span><button class="btn" id="rv">Batal</button><button class="btn p" id="sv">Simpan ke robot</button></div>
<div class="toast" id="toast"></div>
<div class="modal" id="pin"><div><b style="font:700 13px var(--hd);letter-spacing:.14em;color:var(--acc)">PIN ADMIN</b><span class="sub">Aksi ini memerlukan PIN dashboard.</span><input type="password" id="pi" placeholder="Masukkan PIN"><div class="acts" style="justify-content:flex-end"><button class="btn" id="px">Batal</button><button class="btn p" id="po">Konfirmasi</button></div></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('s'),2300)};
const log=h=>$$('.log').forEach(l=>l.insertAdjacentHTML('afterbegin',`<div>${new Date().toTimeString().slice(0,8)} · ${h}</div>`));
// ---- builder ----
const ctl=f=>{const[t,l,s,v,o]=f;let c='';
if(t=='sw')c=`<label class="sw"><input type="checkbox" ${v?'checked':''}><span></span></label>`;
if(t=='rg')c=`<div class="rgw"><input type="range" min="${o[0]}" max="${o[1]}" value="${v}" data-u="${o[2]||''}" style="--p:${(v-o[0])/(o[1]-o[0])*100}%"><b>${v}${o[2]||''}</b></div>`;
if(t=='sg')c=`<div class="seg">${o.map((x,i)=>`<button class="${i==v?'on':''}">${x}</button>`).join('')}</div>`;
if(t=='sel')c=`<select>${o.map((x,i)=>`<option ${i==v?'selected':''}>${x}</option>`).join('')}</select>`;
if(t=='txt')c=`<input type="${o||'text'}" value="${v}" style="width:${o=='time'?'86px':'150px'}">`;
if(t=='in')c=`<span class="v">${v}</span>`;
if(t=='ok')c=`<span class="pill"><span class="dot ${o||''}"></span>${v}</span>`;
if(t=='bt')c=`<button class="btn ${o||''}" data-act="${v}">${v}</button>`;
return`<div class="row"><div>${l}${s?`<small>${s}</small>`:''}</div>${c}</div>`};
const card=(t,rows,c='c6',x='')=>`<div class="card ${c}"><h3>${t}</h3>${rows.map(ctl).join('')}${x}</div>`;
const meters=a=>a.map(([n,v])=>`<div class="ml"><span>${n}</span><span>${v}%</span></div><div class="meter"><i style="width:${v}%"></i></div>`).join('');
const scr=()=>`<div class="screen"><div class="eye"></div><div class="eye"></div><div class="mouth"></div></div>`;
// ---- emosi ----
const E={happy:{lb:'38%',n:'Senang',m:'Ceria'},curious:{t:'translateY(-6px)',w:1.1,n:'Penasaran',m:'Penasaran'},shy:{lt:'28%',t:'translate(-8px,8px)',n:'Malu',m:'Pemalu'},love:{lb:'25%',lt:'10%',c:'#ff7ab6',n:'Sayang',m:'Penuh cinta'},sad:{lt:'35%',t:'rotate(-6deg)',n:'Sedih',m:'Sendu'},surprised:{w:1.25,h:1.3,n:'Kaget',m:'Terkejut'},thinking:{t:'translate(10px,-8px)',lt:'18%',n:'Berpikir',m:'Fokus'},agree:{lt:'12%',t:'translateY(5px)',n:'Setuju',m:'Setuju'},disagree:{lt:'30%',lb:'12%',n:'Tidak setuju',m:'Skeptis'},wink:{wink:1,lb:'30%',n:'Kedip',m:'Jahil'},laugh:{lb:'55%',n:'Tertawa',m:'Terhibur'},sleepy:{lt:'58%',n:'Ngantuk',m:'Mengantuk'}};
function setEmo(k,say){const e=E[k];$$('.screen').forEach(sc=>[...sc.querySelectorAll('.eye')].forEach((el,i)=>{const s=el.style;s.setProperty('--lt',e.lt||'0%');s.setProperty('--lb',e.lb||'0%');s.setProperty('--t',e.t||'none');s.background=e.c||'';s.boxShadow=e.c?'0 0 22px '+e.c+'99':'';s.width=17*(e.w||1)+'%';s.aspectRatio='1/'+(1.15*(e.h||1)/(e.w||1));if(e.wink&&i)s.setProperty('--lt','48%'),s.setProperty('--lb','48%')}));
$$('.emo .chip').forEach(c=>c.classList.toggle('on',c.dataset.k==k));$$('.mood').forEach(m=>m.textContent=e.m);if(say)log('Ekspresi <em>'+e.n+'</em> dikirim ke robot')}
const emoChips=`<div class="chips emo">${Object.entries(E).map(([k,v])=>`<button class="chip" data-k="${k}">${v.n}</button>`).join('')}</div>`;
// ---- tampilan ----
const SFX=['curious','wake','love','pickup','putdown','shake','surprise','notification','success','failure','error','sleep'];
const sfxChips=`<div class="chips">${SFX.map(n=>`<button class="chip" data-sfx="${n}">♪ ${n}</button>`).join('')}</div><div class="eq">${'<i></i>'.repeat(28)}</div>`;
const V={
home:['🏠','Beranda','Halo, Sonic','Robot kamu sedang santai dan siap diajak ngobrol.',
`<div class="grid"><div class="card c5"><h3>Layar OLED <span class="pill"><span class="dot"></span><span class="mood">Ceria</span></span></h3>${scr()}${emoChips}</div>
<div class="card c7"><h3>Aksi Cepat</h3><div class="acts" style="margin-bottom:16px"><button class="btn p" id="talk">◉ Mulai ngobrol</button><button class="btn" data-pause="900">❚❚ 15 menit</button><button class="btn" data-pause="3600">❚❚ 1 jam</button><button class="btn" data-pause="0">❚❚ Sampai dilanjut</button><button class="btn" id="resume">▶︎ Lanjutkan</button></div><span class="pill" id="pz" style="display:none"><span class="dot w"></span><span></span></span>
<div class="tiles" style="margin-top:14px"><div><small>Input</small><b>Wake word</b></div><div><small>Gemini</small><b>Siap</b></div><div><small>Mode</small><b id="dnd">Aktif</b></div></div></div>
<div class="card c4"><h3>Suasana Hati</h3>${meters([['Energi',72],['Rasa ingin tahu',86],['Kedekatan',64],['Sosial',58]])}</div>
<div class="card c8"><h3>Sensor Langsung</h3><div class="tiles"><div><small>Suhu AHT20</small><b id="t">28.4°C</b></div><div><small>Kelembapan</small><b id="h">61%</b></div><div><small>Tekanan BMP280</small><b>1009 hPa</b></div><div><small>PIR</small><b id="pir">Ada orang</b></div><div><small>Sentuh kepala</small><b id="th">Idle</b></div><div><small>Sentuh samping</small><b>Idle</b></div><div><small>IMU</small><b>Stabil</b></div><div><small>Wi-Fi</small><b>-54 dBm</b></div></div></div>
<div class="card c12"><h3>Aktivitas Terbaru</h3><div class="log"></div></div></div>`],
face:['🎭','Wajah','Wajah & Ekspresi','Atur karakter mata, alis, dan gerakan hidup robot.',
`<div class="grid"><div class="card c5"><h3>Pratinjau</h3>${scr()}${emoChips}</div><div class="c7" style="display:grid;gap:16px">${card('Karakter Wajah',[['sw','Kehidupan wajah','Gerakan mikro & mata hidup',1],['sw','Pupil & kilau','',1],['sw','Alis','',1],['sw','Alis otomatis','Mengikuti emosi',1],['sw','Bulu mata','',0],['sw','Bulu mata otomatis','',1],['sw','Akting tanpa pupil','Ekspresi lebih dramatis',1],['sg','Mulut','',1,['Otomatis','Sembunyi','Selalu']]],'')}${card('Penyetelan Halus',[['rg','Gerak mikro','',45,[0,100,'%']],['rg','Gain siluet','',60,[0,150,'%']],['rg','Jangkauan tatapan','',70,[0,100,'%']]],'')}</div></div>`],
voice:['🎙️','Suara','Suara & Percakapan','Persona, mode input, dan koneksi Gemini Live.',
`<div class="grid">${card('Percakapan',[['sg','Mode input','',1,['Sentuh','Wake word','Selalu']],['txt','Nama robot','','Sonic'],['sel','Gaya bicara','Dipakai sebagai persona',0,['Santai & hangat','Ceria','Tenang','Lebih lambat']],['sel','Bahasa','',0,['Indonesia (id-ID)','English (en-US)']],['sel','Jendela lanjutan','Menunggu setelah menjawab',1,['6 detik','10 detik','15 detik']],['sw','Ingatan jangka panjang','',1]])}
${card('Audio',[['sw','Suara utama','',1],['sw','Bicara (TTS)','',1],['rg','Volume speaker','Aman untuk speaker 8Ω / 1W',45,[0,100,'%']],['rg','Gain mikrofon','INMP441 → PCM16',32,[10,60,'/10×']],['rg','Jeda anti-gema','Setelah speaker berhenti',300,[100,800,' ms']]])}
${card('Gemini Live',[['txt','Model','','gemini-3.8-live'],['sel','Suara','',0,['Iapetus','Puck','Kore','Charon']],['txt','API key','','AIzaSyxxxxxxxx','password'],['ok','Status koneksi','','Terhubung'],['bt','Tes koneksi','','Tes koneksi']],'c12')}</div>`],
sonic:['🔊','Sonic','Sonic Character','Efek suara prosedural: bunyi ekspresif robot tanpa file audio.',
`<div class="grid">${card('Uji Efek Suara',[],'c6',sfxChips)}${card('Pengaturan Sonic',[['sw','Suara karakter','',1],['sw','Nada bangun','Saat wake word',1],['sw','Nada sentuhan','Afeksi saat dielus',1],['sw','Efek gerak','Angkat, taruh, goyang, kaget',1],['sw','Notifikasi','Sukses, gagal, error',1],['sg','Frekuensi','',1,['Rendah','Normal','Ekspresif']],['rg','Intensitas efek','',70,[0,100,'%']]])}
${card('Jam Tenang',[['sw','Aktifkan jam tenang','',1],['txt','Mulai','','22:00','time'],['txt','Selesai','','06:00','time'],['rg','Volume saat tenang','',25,[0,100,'%']]],'c12')}</div>`],
mind:['🧠','Otak','Otak & Ingatan','Kepribadian, kedekatan, dan hal yang robot ingat tentangmu.',
`<div class="grid"><div class="card c4"><h3>Kepribadian</h3>${meters([['Energi',72],['Rasa ingin tahu',86],['Kehangatan',78],['Keusilan',41],['Kepercayaan',64]])}</div>
<div class="card c8"><h3>Statistik Otak</h3><div class="tiles"><div><small>Memori</small><b>128</b></div><div><small>Relasi</small><b>3</b></div><div><small>Memori sosial</small><b>42</b></div><div><small>Hari evolusi</small><b>17</b></div></div><h3 style="margin-top:20px">Tren suhu 24 jam</h3><svg class="ch" id="chart" viewBox="0 0 300 90" preserveAspectRatio="none"></svg></div>
<div class="card c12"><h3>Ingatan Robot <button class="btn d" data-gate="mem">Hapus semua</button></h3><div id="mems"></div><div class="acts" style="margin-top:6px"><button class="btn" data-act="Ekspor ingatan">↓ Ekspor</button></div></div></div>`],
diag:['🩺','Diagnostik','Diagnostik','Kesehatan perangkat keras, audio, dan interaksi secara langsung.',
`<div class="grid">${card('Audio Pipeline',[['in','Status voice','listening'],['ok','Mikrofon','OK'],['ok','Speaker','OK'],['in','Noise floor','128 RMS'],['in','Ambang VAD mulai / akhir','420 / 360']])}
<div class="card c6"><h3>Buffer & Memori</h3>${meters([['Speaker ring (32 KB)',22],['Pre-roll (6.4 KB)',48],['Heap bebas',63],['PSRAM bebas',81]])}<div class="row"><div>OLED delta error / fallback</div><span class="v">0 / 0</span></div><div class="row"><div>Uptime</div><span class="v" id="up">02:14:08</span></div></div>
${card('Penghitung Interaksi',[['sw','Rekam metrik','',1],['in','Sentuh kepala','42'],['in','Sentuh samping','17'],['in','PIR naik','65'],['in','Peristiwa gerak','9']])}
<div class="card c6"><h3>Peta Pin</h3><div class="tiles">${[['SDA / SCL','8 / 9'],['Touch kepala','7'],['Touch samping','16'],['PIR','15'],['Mic WS/BCLK/DIN','4/5/6'],['Spk DIN/BCLK/LRC','11/12/13'],['OLED','0x3C'],['IMU / BMP','0x68 / 0x77']].map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('')}</div></div>
<div class="card c12"><h3>Log Serial <button class="btn" data-act="Salin log">Salin</button></h3><div class="log"></div></div></div>`],
net:['📶','Jaringan','Jaringan','Prioritas Wi-Fi, mode setup, dan sinkron waktu.',
`<div class="grid"><div class="card c7"><h3>Daftar Wi-Fi (urut prioritas)</h3><div id="nets"></div><div class="acts" style="margin-top:12px"><input type="text" placeholder="SSID"><input type="password" placeholder="Kata sandi"><button class="btn p" id="addw">+ Tambah</button></div></div>
<div class="c5" style="display:grid;gap:16px;align-content:start">${card('Status',[['in','IP','192.168.1.42'],['in','Sinyal','-54 dBm · Kuat'],['ok','Sinkron NTP','Tersinkron'],['sel','Zona waktu','',0,['UTC+7 (WIB)','UTC+8 (WITA)','UTC+9 (WIT)']]],'')}${card('Mode Setup (AP)',[['in','SSID','RoboDesk-Setup'],['in','Aktif otomatis','15 dtk tanpa Wi-Fi'],['bt','Buka mode setup','Buka mode setup']],'')}</div></div>`],
sys:['⚙️','Sistem','Sistem','Firmware, keamanan, dan zona admin.',
`<div class="grid">${card('Firmware (OTA)',[['in','Versi terpasang','v0.15.0-dev'],['in','Partisi aktif','ota_0'],['bt','Cek pembaruan','Cek pembaruan']],'c6','<div class="meter" style="margin-top:12px"><i id="ota" style="width:0"></i></div>')}
${card('Keamanan',[['bt','Ubah PIN admin','Ubah PIN'],['sw','Wajib PIN untuk aksi sensitif','',1],['bt','Ekspor pengaturan','Ekspor'],['bt','Impor pengaturan','Impor']])}
<div class="card c12" style="border-color:#e5484d55"><h3 style="color:var(--bad)">Zona Berbahaya</h3><div class="acts"><button class="btn" data-gate="Restart robot">Restart robot</button><button class="btn d" data-gate="Hapus ingatan">Hapus ingatan</button><button class="btn d" data-gate="Reset pabrik">Reset pabrik</button></div></div></div>`]};
const IC={"home": "<path d=\"M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"/>", "face": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M8.5 10h.01M15.5 10h.01M8.5 15c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8\"/>", "voice": "<rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"/>", "sonic": "<path d=\"M3 12h2M7 7v10M11 4v16M15 8v8M19 10v4\"/>", "mind": "<rect x=\"7\" y=\"7\" width=\"10\" height=\"10\" rx=\"2\"/><path d=\"M9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4\"/>", "diag": "<path d=\"M3 12h4l2-6 4 12 2-6h6\"/>", "net": "<path d=\"M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0M12 19.5h.01\"/>", "sys": "<path d=\"M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0\"/><circle cx=\"16\" cy=\"6\" r=\"2\"/><circle cx=\"10\" cy=\"12\" r=\"2\"/><circle cx=\"18\" cy=\"18\" r=\"2\"/>"};
$('#nav').innerHTML=Object.entries(V).map(([k,v],i)=>`<button class="nav ${i?'':'on'}" data-v="${k}"><svg viewBox="0 0 24 24">${IC[k]}</svg>${v[1]}</button>`).join('');
$('#views').innerHTML=Object.entries(V).map(([k,v],i)=>`<section class="view ${i?'':'on'}" id="${k}">${v[4]}</section>`).join('');
function go(k){$$('.nav').forEach(x=>x.classList.toggle('on',x.dataset.v==k));$$('.view').forEach(v=>v.classList.toggle('on',v.id==k));$('#ttl').textContent=V[k][2];$('#sub').textContent=V[k][3];scrollTo(0,0)}
$$('.nav').forEach(b=>b.onclick=()=>go(b.dataset.v));go('home');
$('#sfx')&&0;
// ---- data dinamis ----
const MEM=[['Suka kopi tanpa gula','Preferensi · 3 hari lalu'],['Anjing bernama Mochi','Keluarga · 1 minggu lalu'],['Ulang tahun 12 Mei','Tanggal penting'],['Biasa kerja sampai jam 10 malam','Kebiasaan'],['Tidak suka dibangunkan terlalu pagi','Preferensi']];
const rm=()=>{$('#mems').innerHTML=MEM.map((m,i)=>`<div class="mem"><span>${m[0]}<br><small>${m[1]}</small></span><button data-m="${i}" title="Hapus">✕</button></div>`).join('')||'<div class="sub">Belum ada ingatan.</div>'};rm();
const NETS=[['Rumah-5G','-54 dBm',1],['Kantor-WiFi','Tidak terjangkau',0],['HP-Hotspot','Tidak terjangkau',0]];
const rn=()=>{$('#nets').innerHTML=NETS.map((n,i)=>`<div class="net"><span class="no">${i+1}</span><div class="n">${n[0]}<small>${n[1]}</small></div>${n[2]?'<span class="pill"><span class="dot"></span>Terhubung</span>':''}<button class="btn" data-up="${i}">↑</button><button class="btn d" data-del="${i}">✕</button></div>`).join('')};rn();
{const p=[...Array(24)].map((_,i)=>[i*12.5,45-Math.sin(i/3.8)*22-Math.random()*5]);$('#chart').innerHTML=`<polyline fill="none" stroke="var(--acc)" stroke-width="2.5" points="${p.map(a=>a.join(',')).join(' ')}"/><polygon fill="var(--acc)" opacity=".1" points="0,90 ${p.map(a=>a.join(',')).join(' ')} 300,90"/>`}
// ---- pin gate ----
let gated=null;const gate=(l,f)=>{gated=f||(()=>toast('✓ '+l+' dijalankan'));$('#pin').classList.add('s');$('#pi').value='';$('#pi').focus()};
$('#px').onclick=()=>$('#pin').classList.remove('s');
$('#po').onclick=()=>{if($('#pi').value=='robodesk'){$('#pin').classList.remove('s');gated()}else toast('PIN salah')};
// ---- delegasi event ----
const dirty=()=>$('#bar').classList.add('s');
document.addEventListener('input',e=>{const t=e.target;if(t.type=='range'){t.nextElementSibling.textContent=t.value+t.dataset.u;t.style.setProperty('--p',(t.value-t.min)/(t.max-t.min)*100+'%')}if(t.closest('.view')&&t.closest('.card'))dirty()});
document.addEventListener('click',e=>{const t=e.target,c=t.closest('button');if(!c)return;
if(c.closest('.seg')){[...c.parentNode.children].forEach(x=>x.classList.toggle('on',x==c));dirty()}
if(c.dataset.k){setEmo(c.dataset.k,1);toast('Ekspresi: '+E[c.dataset.k].n)}
if(c.dataset.sfx){toast('Memutar suara: '+c.dataset.sfx);log('Tes suara <em>'+c.dataset.sfx+'</em>');let n=0;const iv=setInterval(()=>{$$('.eq i').forEach(b=>b.style.height=(8+Math.random()*90)+'%');if(++n>14){clearInterval(iv);$$('.eq i').forEach(b=>b.style.height='6%')}},110)}
if(c.dataset.pause!=null&&c.dataset.pause!==''){const s=+c.dataset.pause;$('#pz').style.display='inline-flex';$('#pz span:last-child').textContent=s?'Inisiatif dijeda '+s/60+' menit':'Dijeda sampai dilanjutkan';$('#dnd').textContent='Dijeda';toast('Robot tidak akan menyapa lebih dulu')}
if(c.id=='resume'){$('#pz').style.display='none';$('#dnd').textContent='Aktif';toast('Inisiatif dilanjutkan')}
if(c.dataset.m){MEM.splice(+c.dataset.m,1);rm();toast('Ingatan dihapus')}
if(c.dataset.up){const i=+c.dataset.up;if(i){NETS.splice(i-1,0,NETS.splice(i,1)[0]);rn();dirty()}}
if(c.dataset.del){NETS.splice(+c.dataset.del,1);rn();dirty()}
if(c.dataset.gate)gate(c.dataset.gate);
if(c.dataset.act){const a=c.dataset.act;if(['Ubah PIN','Buka mode setup'].includes(a))gate(a);else if(a=='Cek pembaruan'){const o=$('#ota');o.style.width='0';let w=0;const iv=setInterval(()=>{o.style.width=(w+=12)+'%';if(w>=100){clearInterval(iv);toast('Firmware sudah terbaru ✓')}},120)}else toast(a+' …')}
if(c.id=='addw'){const i=c.parentNode.querySelectorAll('input');if(i[0].value){NETS.push([i[0].value,'Baru ditambahkan',0]);rn();i[0].value=i[1].value='';dirty()}}
if(c.id=='sv'){$('#bar').classList.remove('s');toast('✓ Pengaturan tersimpan di robot');log('Pengaturan <em>disimpan</em>')}
if(c.id=='rv'){$('#bar').classList.remove('s');toast('Perubahan dibatalkan')}
if(c.id=='theme'){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'}
if(c.id=='talk'&&!c.d){c.d=1;$$('.screen').forEach(s=>s.classList.add('talk'));setEmo('thinking');toast('Jendela percakapan dibuka — silakan bicara');log('Percakapan <em>dimulai</em> dari dashboard');setTimeout(()=>{c.d=0;$$('.screen').forEach(s=>s.classList.remove('talk'));setEmo('happy')},5000)}});
// ---- simulasi ----
[['Sentuhan kepala → <em>Sayang</em>'],['PIR: ada orang di dekat meja'],['Wake word dikenali · <em>Gemini siap</em>'],['Robot diangkat → <em>Kaget</em>'],['Wi-Fi terhubung · <em>Rumah-5G</em>']].reverse().forEach(x=>log(x[0]));
setInterval(()=>{$('#t').textContent=(28+Math.random()).toFixed(1)+'°C';$('#h').textContent=Math.round(60+Math.random()*3)+'%'},2000);
setInterval(()=>{const on=Math.random()>.7;$('#th').textContent=on?'Disentuh':'Idle';if(on)log('Sentuhan kepala → <em>Sayang</em>')},7000);
let u=8048;setInterval(()=>{u++;$('#up').textContent=[u/3600|0,u/60%60|0,u%60].map(x=>String(x).padStart(2,'0')).join(':')},1000);
setEmo('happy');
const tk=()=>$('#clk').textContent=new Date().toTimeString().slice(0,8);tk();setInterval(tk,1000);
</script></body></html>

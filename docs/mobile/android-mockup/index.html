const screens=[
{id:'welcome',title:'Selamat datang',group:'Mulai & koneksi',tab:'',back:'',content:()=>`<div class="onboard">${face('happy','ROBO DESK • BRIDGE')}<div class="tagline">TEMAN KECIL. KONEKSI BESAR.</div><h2>Teman kecil,<br>tetap dekat.</h2><p>Bawa notifikasi pilihan dan petunjuk jalan dari HP ke RoboDesk.</p>${btn('Hubungkan robot','permissions','primary','bluetooth')}${btn('Lihat privasi','privacy','secondary','shield')}<p class="modalnote">Tanpa akun. Tanpa iklan. Kamu pilih data yang dibagikan.</p></div>`,note:'Pembukaan tanpa akun. Pengguna memahami fungsi bridge sebelum memberikan izin.',accept:['Tidak meminta izin otomatis.','Tautan privasi dapat dibuka sebelum pairing.']},
{id:'permissions',title:'Kamu pegang kendali',group:'',tab:'',back:'welcome',content:()=>`<p>Berikan izin hanya saat fiturnya diperlukan. Kamu bisa mencabutnya dari pengaturan Android.</p><div class="card tint"><div class="row"><div class="appicon">${icon('bluetooth')}</div><div><h2>Perangkat di sekitar</h2><div class="small">Untuk mencari dan menghubungkan robot.</div></div></div>${btn('Izinkan Bluetooth','','secondary')}</div><div class="card"><div class="row"><div class="appicon violet">${icon('bell')}</div><div><h2>Akses notifikasi</h2><div class="small">Untuk notifikasi pilihan dan Google Maps.</div></div></div><div class="notice warn">Izin Android ini luas. Filter aplikasi hanya membatasi data yang diteruskan, bukan cakupan izin sistem.</div>${btn('Buka izin Android','','secondary')}</div>${check('Tidak meminta kamera, mikrofon, kontak, atau GPS.')}${btn('Lanjutkan','devices')}<button class="textbtn" data-go="devices">Hubungkan robot tanpa akses notifikasi</button><div class="stepdots"><i class="active"></i><i></i><i></i></div>`,note:'Izin bertahap. Companion Device Manager direncanakan untuk pemilihan robot; notifikasi tetap memerlukan izin sistem tersendiri.',accept:['Penolakan izin punya jalur pemulihan.','Tidak memaksa izin notifikasi untuk pairing.']},
{id:'devices',title:'Pilih RoboDesk',group:'',tab:'',back:'permissions',content:()=>`<p>Pilih robot milikmu. Perangkat yang ditemukan belum dianggap terverifikasi.</p><div class="search">${icon('search')}<span>Mencari robot di sekitar…</span></div><div class="card tint"><div class="row"><div class="appicon">${icon('robot')}</div><div class="grow"><h2>RoboDesk Mini</h2><div class="small">S3 + C3 · sinyal kuat</div></div><div class="selection-dot"></div></div><div class="divider"></div><div class="row between"><span class="tiny">Identitas demo · RD-8F2A</span><span class="tiny">−48 dBm</span></div></div><button class="secondary" data-action="demo">${icon('robot')}RoboDesk Studio · −72 dBm</button><div class="notice">Nama perangkat bisa sama. Verifikasi di langkah berikutnya menentukan robot tujuan.</div>${btn('Verifikasi robot','verify','primary','shield')}${btn('Cari ulang','','secondary','refresh')}<button class="textbtn" data-go="offline">Robot tidak ditemukan?</button>`,note:'Tidak lagi menyambung otomatis ke iklan pertama. Semua ID, nama, dan sinyal merupakan data contoh.',accept:['Pilihan pengguna wajib.','UUID dan nama bukan bukti identitas.']},
{id:'verify',title:'Verifikasi robot',group:'',tab:'',back:'devices',content:()=>`<div class="illustration">${icon('shield')}</div><h2 style="text-align:center;margin:0 0 10px;font-size:22px">Cocokkan kode.</h2><p style="text-align:center">Bandingkan dengan kode pada layar robot. Jika berbeda, batalkan koneksi.</p><div class="card"><div class="tiny" style="text-align:center">KODE DEMO · BUKAN KREDENSIAL</div><div class="code">482 916</div><div class="small" style="text-align:center">RoboDesk Mini · RD-8F2A</div></div>${check('Konfirmasi pairing pada dialog Android.')}${check('Setujui ponsel di dashboard robot.')}${btn('Kode cocok · lanjutkan','home','primary','check')}${btn('Kode berbeda · batalkan','blocked','secondary')}<p class="modalnote">Pengiriman data dimulai setelah verifikasi dan persetujuan selesai.</p>`,note:'Layar usulan untuk pairing Bluetooth dengan kode, diikuti persetujuan dashboard. Tidak meniru konfirmasi sistem Android.',accept:['Tidak meneruskan notifikasi sebelum autentikasi.','Kode berbeda mengakhiri proses pairing.']},
{id:'home',title:'Halo, RoboDesk.',group:'Bridge sehari-hari',tab:'home',back:'',content:()=>`<div class="row between" style="margin:1px 0 15px">${pill('Robot terverifikasi')}<span class="tiny">RD-8F2A · demo</span></div><div class="hero">${face('happy','ACTIVE BUT CALM')}<div class="row between"><div><b>RoboDesk Mini</b><div class="small">Siap menemanimu.</div></div><button class="iconbtn" data-go="robot" aria-label="Buka robot">${icon('robot')}</button></div></div><div class="grid2"><div class="card linkrow" data-go="apps" role="button" tabindex="0"><span style="color:var(--purple)">${icon('bell')}</span><h2>Notifikasi</h2><span class="count">3</span><div class="tiny">aplikasi pilihan</div></div><div class="card linkrow" data-go="navigation" role="button" tabindex="0"><span style="color:var(--cyan)">${icon('nav')}</span><h2>Navigasi</h2><b style="font-size:12px">Belok kiri</b><div class="tiny">200 m · Jalan Merdeka</div></div></div><div class="sectiontitle">Kontrol cepat</div><div class="card flush">${toggleRow('Mode tenang','Jeda tampilan notifikasi dan suara.','moon',false)}${row('Kontrol privasi','Tentukan apa yang dibagikan.','shield','privacy')}</div><button class="primary violet" data-action="pause">${icon('pause')}<span>${paused.value?'Lanjutkan bridge':'Jeda semua pengiriman'}</span></button><p class="modalnote">Terakhir tersinkron · 3 detik lalu · data demo</p>`,note:'Beranda merangkum koneksi, data aktif, dan kontrol darurat. Pausing harus benar-benar menghentikan pengiriman dalam implementasi nanti.',accept:['Status berasal dari ACK, bukan sekadar GATT terhubung.','Jeda menghapus data tertunda.']},
{id:'apps',title:'Aplikasi pilihan',group:'',tab:'apps',back:'',content:()=>`<p>Pilih aplikasi dan jumlah informasi yang boleh muncul di robot.</p><div class="search">${icon('search')}<input placeholder="Cari aplikasi…" aria-label="Cari aplikasi demo" data-filter-apps></div><div class="card flush" id="appList">${appRow('WhatsApp','Judul saja','W','green',true)}${appRow('Telegram','Judul + cuplikan','T','',true)}${appRow('Kalender','Judul saja','17','violet',true)}${appRow('Bank demo','Tidak dibagikan','B','amber',false)}${appRow('Email demo','Tidak dibagikan','@','',false)}</div><div class="notice">Saat pertama dipasang, semua aplikasi nonaktif. Layar ini menunjukkan konfigurasi contoh.</div>${btn('Lihat pengiriman terbaru','notifications','secondary','clock')}<div class="tiny">Pilihan efektif mengikuti izin HP dan allowlist robot. Perubahan di HP tidak dapat memperluas izin robot.</div>`,note:'Contoh setelah pengguna melakukan konfigurasi. Allowlist robot tetap menjadi batas atas; mode lokal hanya bisa mempersempit.',accept:['Default semua aplikasi off.','Tidak menggunakan QUERY_ALL_PACKAGES.']},
{id:'appDetail',title:'Atur Telegram',group:'',tab:'apps',back:'apps',content:()=>`<div class="row" style="margin:8px 0 22px"><div class="appicon" style="width:48px;height:48px;font-size:20px">T</div><div><b>Telegram</b><div class="small">Aplikasi contoh</div></div></div><div class="card flush">${toggleRow('Teruskan notifikasi','Diizinkan robot pada contoh ini.','bell',true)}</div><div class="sectiontitle">Isi yang dibagikan</div><div class="card"><div class="segments"><button data-segment>Nama aplikasi</button><button data-segment>Judul saja</button><button class="selected" data-segment>Cuplikan</button></div><p style="margin-top:12px">Maksimum 80 karakter. Kode sensitif disamarkan sebelum dikirim.</p></div><div class="card"><div class="tiny">CONTOH TAMPILAN · BUKAN PESAN ASLI</div><div class="oledroute" style="margin-top:10px">Telegram<br>Pesan demo<br>Sampai jumpa sore ini.</div></div><div class="card flush">${toggleRow('Saat HP terkunci','Tampilkan nama aplikasi saja.','lock',true)}${toggleRow('Bacakan di robot','Memerlukan persetujuan cloud terpisah.','cloud',false)}</div>${btn('Simpan pilihan','apps')}<div class="notice">Jika robot tidak mengizinkan aplikasi ini, pengiriman tetap diblokir.</div>`,note:'Preview sintetis membantu pengguna memilih tingkat konten. Pengaturan cloud harus dikonfirmasi lagi di robot/dashboard.',accept:['Tidak memakai isi notifikasi nyata sebagai preview default.','Mode saat terkunci hanya bisa lebih ketat.']},
{id:'notifications',title:'Pengiriman terbaru',group:'',tab:'apps',back:'apps',content:()=>`<p>Ringkasan sementara, tanpa menyimpan isi pesan.</p><div class="card"><div class="timeline"><div class="row between"><b>Telegram</b>${pill('Diterima robot')}</div><p>Cuplikan · 1 menit lalu</p></div><div class="timeline"><div class="row between"><b>Kalender</b>${pill('Diterima robot')}</div><p>Judul saja · 2 menit lalu</p></div><div class="timeline"><div class="row between"><b>Bank demo</b>${pill('Diblokir','warn')}</div><p>Tidak ada konten yang diteruskan.</p></div></div><div class="notice">Daftar hanya metadata di RAM. Isi pesan, kode verifikasi, dan identitas akun tidak muncul di sini.</div>${btn('Hapus daftar sesi','','secondary','trash')}<button class="textbtn" data-go="empty">Lihat kondisi tanpa notifikasi</button>`,note:'Riwayat berbasis metadata terbatas dan tidak persisten. Tidak menjadi inbox kedua.',accept:['Tidak mencatat judul/body ke log.','ACK diperlukan untuk label diterima.']},
{id:'navigation',title:'Petunjuk jalan',group:'',tab:'navigation',back:'',content:()=>`<div class="card flush">${toggleRow('Google Maps','Teruskan petunjuk ke OLED.','nav',true)}</div><div class="card navbig"><div class="row between"><span class="tiny">INSTRUKSI DEMO</span>${pill('Baru diperbarui')}</div><div class="arrow">${icon('arrow')}</div><div class="distance">200 <span style="font-size:23px">m</span></div><h2>Belok kiri</h2><div class="small">Jalan Merdeka</div><div class="divider"></div><div class="row between"><div><div class="tiny">ESTIMASI</div><b>12 menit</b></div><div><div class="tiny">TIBA</div><b>?</b></div></div></div><div class="sectiontitle">Preview OLED</div><div class="oledroute">${icon('arrow')}<span>200 m<br>Jalan Merdeka<br>12 menit</span></div><p class="modalnote">Petunjuk berasal dari notifikasi Maps. Bukan peta penuh.</p><button class="textbtn" data-go="unknown">Lihat data lama / format tidak dikenal</button>`,note:'Tetap menggunakan parser Maps yang ada. ETA tampil hanya jika sumber menyediakannya; jam tiba tidak ditampilkan ketika sumber tidak menyediakan nilainya.',accept:['Arah/jarak tidak ditebak saat hilang.','Data lama 30 detik, kedaluwarsa 120 detik.']},
{id:'privacy',title:'Privasi & data',group:'',tab:'settings',back:'home',content:()=>`<div class="card tint"><div class="row"><div class="appicon">${icon('shield')}</div><div><h2>Lokal secara default</h2><div class="small">HP → Bluetooth → robot</div></div></div><p style="margin-top:11px">APK tidak mengirim konten ke internet. Izin notifikasi Android tetap luas.</p></div><div class="card flush">${toggleRow('Saat HP terkunci','Bagikan nama aplikasi saja.','lock',true)}${toggleRow('Samarkan data sensitif','Kode OTP, token, email dan nomor HP.','eye',true)}</div><div class="card"><div class="row between"><h2>Pembacaan cloud</h2>${pill('Nonaktif','purple')}</div><p>Jika diaktifkan di robot, cuplikan aplikasi pilihan dikirim ke Google Gemini. Memerlukan persetujuan terpisah.</p>${btn('Tinjau persetujuan cloud','','secondary','cloud')}</div>${btn('Hapus antrean HP + robot','','secondary','trash')}${btn('Cabut izin notifikasi','','secondary','logout')}<button class="textbtn" data-go="reset">Lupakan robot dan hapus data pairing</button>`,note:'Memisahkan batas jaringan APK dari pengiriman cloud oleh firmware. Semua opsi keamanan di sini masih konsep.',accept:['Tidak menyatakan allowlist mempersempit izin Android.','Tidak menjanjikan redaksi mendeteksi semua rahasia.']},
{id:'robot',title:'Karakter RoboDesk',group:'Robot & dukungan',tab:'robot',back:'',content:()=>`<div class="hero">${face('happy','CURIOUS • CALM')}<div class="row between"><b>RoboDesk Mini</b>${pill('Tersambung')}</div></div><div class="card"><h2>Seberapa aktif?</h2><p>Inisiatif tetap mengikuti privasi dan jam tenang.</p><div class="segments"><button data-segment>Halus</button><button class="selected" data-segment>Tenang</button><button data-segment>Ekspresif</button></div></div><div class="card flush">${row('Aktivitas companion','13 aktivitas di firmware robot.','heart','activities')}${row('Jam tenang','22.00–07.00 · contoh','moon','settings')}${row('Status mikrofon robot','Tidak membaca mikrofon HP.','shield','privacy','Aktif')}</div><div class="notice">Kontrol karakter dari aplikasi direncanakan setelah kanal perintah robot diautentikasi.</div>`,note:'Firmware telah memiliki 13 aktivitas. Kontrol native Android memerlukan API BLE terpisah dan ACK; mockup belum mengubah robot.',accept:['Perintah perilaku tunduk pada gate robot.','Tidak menambah perekaman mikrofon HP.']},
{id:'activities',title:'Aktivitas companion',group:'',tab:'robot',back:'robot',content:()=>`<p>Biarkan RoboDesk berinisiatif, atau pilih aktivitas. Robot bisa menolak jika sedang sibuk.</p><div class="activity-list">${activityCard('Pixel doodle','Menggambar piksel','✧')}${activityCard('Temani fokus','Hadir tanpa banyak suara','◎')}${activityCard('Napas tenang','Ritme visual perlahan','◌')}${activityCard('Touch play','Main sentuh kepala','⌁')}${activityCard('Rhythm improv','Pola suara pendek','♫')}${activityCard('Watch room','Amati suasana','◉')}</div><div class="notice">Juga tersedia: curious_look, expression_practice, rhythm_play, daydream, stretch_reset, rest, dan quiet_company. Semua 13 aktivitas milik firmware robot.</div>${btn('Biarkan otomatis','robot','secondary')}`,note:'Enam aktivitas baru ditonjolkan; tujuh lainnya tetap dapat ditemukan. Nama teknis lama perlu dipetakan ke label Indonesia.',accept:['Jangan menciptakan aktivitas baru hanya demi tampilan.','Navigasi dan interaksi pengguna tetap prioritas.']},
{id:'activityDetail',title:'Temani fokus',group:'',tab:'robot',back:'activities',content:()=>`<div class="hero">${face('','FOCUS COMPANY')}</div><h2 style="font-size:23px;margin:0 0 12px">Teman fokus yang tenang.</h2><p>RoboDesk menemanimu dengan gerakan mata lembut. Aktivitas berhenti sementara saat kamu berinteraksi atau petunjuk jalan masuk.</p><div class="card"><div class="row between"><span class="small">Durasi aktivitas</span><b>60 detik · contoh</b></div><div class="progress"><i></i></div><div class="meter-label"><span>Tenang</span><span>Tanpa suara proaktif</span></div></div>${btn('Mulai aktivitas','','primary','play')}${btn('Jeda / lanjutkan','','secondary','pause')}${btn('Hentikan aktivitas','','secondary')}<p class="modalnote">Hasil perintah harus dikonfirmasi robot, bukan hanya Bluetooth.</p>`,note:'Contoh detail aktivitas. Durasi mengikuti katalog firmware; tidak menyatakan satu siklus ini adalah Pomodoro.',accept:['Tidak tampil berhasil sebelum ACK.','Alasan ditolak harus terlihat.']},
{id:'battery',title:'Baterai & latar belakang',group:'',tab:'settings',back:'settings',content:()=>`<div class="illustration">${icon('battery')}</div><div class="card"><div class="row between"><h2>Mode seimbang</h2>${pill('Disarankan')}</div><p>Mencari robot terpilih saja. Saat terputus lama, percobaan koneksi dikurangi.</p></div><div class="card flush">${row('Optimasi baterai Android','Tetap mengikuti pengaturan sistem.','battery','settings','Normal')}${row('Akses notifikasi','Layanan pendamping aktif.','bell','permissions','Diizinkan')}</div><div class="notice warn">Beberapa merek HP dapat menghentikan layanan di latar belakang. Ubah pengaturan hanya jika pengiriman benar-benar terhenti.</div>${btn('Buka pengaturan baterai','','secondary','battery')}<div class="card" style="margin-top:16px"><h2>Data yang akan diukur</h2><p>Retry, waktu koneksi dan aktivitas scan. Estimasi persen baterai tidak ditampilkan sebelum ada pengukuran nyata.</p></div>`,note:'Tidak meminta pengecualian baterai otomatis. Background behavior harus diuji per API dan vendor.',accept:['Backoff dengan jitter.','Tidak menjanjikan konsumsi baterai tanpa pengukuran.']},
{id:'diagnostics',title:'Kesehatan koneksi',group:'',tab:'settings',back:'settings',content:()=>`<div class="status-strip">${icon('shield')}Robot terverifikasi · contoh sesi</div><div class="stats"><div class="card"><div class="tiny">ANTREAN HP</div><div class="bigvalue">0 / 12</div><span class="tiny">tidak ada data tertunda</span></div><div class="card"><div class="tiny">TERAKHIR SYNC</div><div class="bigvalue">3 dtk</div><span class="tiny">ACK diterima</span></div></div><div class="card flush">${row('Bluetooth','Terenkripsi · MTU 247','bluetooth','','Baik')}${row('C3 ↔ S3','Robot siap menerima data','link','','Baik')}${row('Retry sesi','Tidak ada putus koneksi','refresh','','0')}${row('Data disamarkan','Jumlah kejadian, tanpa isi','shield','','2')}</div>${btn('Uji kirim data sintetis','','primary','play')}${btn('Tinjau & bagikan diagnostik','','secondary','download')}<div class="notice">Ekspor hanya metadata. Tanpa isi pesan, kode pairing, token, alamat penuh, atau identitas akun.</div>`,note:'Status S3 harus datang dari telemetry baru. Ekspor memakai Android share sheet setelah pengguna meninjau redaksi.',accept:['Tidak mengambil notifikasi asli untuk paket test.','Tidak mengunggah diagnostik otomatis.']},
{id:'settings',title:'Pengaturan',group:'',tab:'settings',back:'',content:()=>`<div class="card tint"><div class="row"><div class="appicon">${icon('robot')}</div><div class="grow"><h2>RoboDesk Mini</h2><div class="small">RD-8F2A · identitas contoh</div></div>${pill('Dipercaya')}</div></div><div class="card flush">${row('Privasi & data','Kamu tentukan batasnya.','shield','privacy')}${row('Baterai & latar belakang','','battery','battery')}${row('Diagnostik','','signal','diagnostics')}${row('Izin Android','','lock','permissions')}${row('Bahasa','','message','','Indonesia')}${row('Tema','','moon','','Gelap')}${row('Tentang aplikasi','','info','about')}</div>${btn('Lupakan robot','reset','danger','trash')}<p class="modalnote">Semua nilai pada mockup adalah contoh.<br>Tidak ada akun atau sinkronisasi cloud APK.</p>`,note:'Tidak ada login, iklan, subscription, atau analytics. Dashboard tetap otoritas persetujuan peer.',accept:['Destructive action memerlukan konfirmasi.','Tidak menyimpan PIN dashboard.']},
{id:'about',title:'Tentang RoboDesk Bridge',group:'',tab:'settings',back:'settings',content:()=>`<div class="onboard" style="padding-top:5px">${face('happy','ROBO DESK')}<h2 style="font-size:25px">Dibuat untuk<br>teman kecilmu.</h2></div><div class="card flush">${row('Versi APK saat ini','Build debug yang sudah dikompilasi.','info','','1.1.0')}${row('Desain ini','Usulan, belum menjadi aplikasi.','apps','','Review 01')}${row('Cara data mengalir','HP → BLE → C3 → S3','link')}${row('Privasi','','shield','privacy')}</div><div class="notice">Bukan release produksi. Verifikasi pairing, pemakaian baterai dan uji perangkat masih diperlukan.</div>${btn('Lihat panduan koneksi','permissions','secondary')}`,note:'Membedakan versi APK yang ada dengan rancangan UI baru. Tidak memakai klaim audit atau sertifikasi palsu.',accept:['Versi dan fingerprint release nyata nanti.','Status debug terlihat jelas.']},
{id:'offline',title:'Robot terputus',group:'Kondisi & pemulihan',tab:'home',back:'home',content:()=>`<div class="hero">${face('sleep','OFFLINE')}<div class="row between"><b>RoboDesk Mini</b>${pill('Terputus','warn')}</div></div><h2 style="font-size:23px;margin:20px 0 10px">Data belum dikirim.</h2><p>Pastikan robot menyala dan dekat dengan HP. Hanya robot yang sudah dipilih akan dicari ulang.</p><div class="card"><div class="row between"><span class="small">Antrean demo</span><b>2 / 12</b></div><div class="small" style="margin-top:10px">Data tertua: 18 detik. Notifikasi kedaluwarsa setelah 5 menit; navigasi setelah 2 menit.</div></div>${btn('Coba lagi','devices','primary','refresh')}${btn('Hapus antrean','','secondary','trash')}${btn('Periksa izin & koneksi','diagnostics','secondary')}<div class="notice">Tidak mengirim ke robot lain sebagai pengganti.</div>`,note:'Tidak memindahkan data ke iklan lain. Reconnect ke identitas yang dipilih saja; pilih ulang hanya lewat pengguna.',accept:['Indikator offline bukan sukses.','Jangan mereset umur pesan saat retry.']},
{id:'blocked',title:'Verifikasi gagal',group:'',tab:'',back:'devices',content:()=>`<div class="illustration blocked-icon">${icon('shield')}</div><h2 style="font-size:24px;text-align:center;margin:0 0 14px">Koneksi dihentikan.</h2><p style="text-align:center">Identitas atau kode robot tidak cocok. Tidak ada data notifikasi yang dikirim.</p><div class="notice bad">Jangan setujui pairing yang tidak kamu mulai. Pilih ulang robot dan cocokkan kode di layarnya.</div>${btn('Pilih ulang robot','devices')}${btn('Baca panduan privasi','privacy','secondary')}<div class="card" style="margin-top:20px"><h2>Robot firmware lama?</h2><p>Mode aman membatasi koneksi ke diagnostik sampai firmware mendukung verifikasi baru.</p></div>`,note:'Untuk mismatch, token ditolak, bond hilang, atau firmware yang tidak mendukung protokol aman. Tidak melakukan downgrade diam-diam.',accept:['Mismatch memutus koneksi dan membuang antrean.','Alasan penolakan tanpa membocorkan secret.']},
{id:'reset',title:'Lupakan robot?',group:'',tab:'settings',back:'settings',content:()=>`<div class="illustration" style="color:var(--red)">${icon('logout')}</div><h2 style="font-size:23px;margin:0 0 14px">Putuskan kepercayaan.</h2><p>Ini menghapus pilihan robot, kredensial bridge dan antrean pada HP. Kamu perlu pairing ulang untuk mengirim data lagi.</p><div class="card">${check('Hapus identitas dan kredensial lokal.')}${check('Hapus antrean serta metadata sesi.')}${check('Cabut peer robot jika koneksi tersedia.')}</div><div class="notice warn">Jika robot offline, pencabutan di robot belum selesai. Lupakan ponsel dari dashboard robot sebelum pairing berikutnya.</div>${btn('Lupakan & hapus data','welcome','danger','trash')}${btn('Batalkan','settings','secondary')}<p class="modalnote">Tidak menghapus pesan atau aplikasi di HP.</p>`,note:'Revoke lokal segera. Revoke remote harus menerima ACK sebelum ditandai selesai; offline jelas sebagai tertunda.',accept:['Tidak mengklaim remote terhapus saat offline.','Tidak menghapus data pengguna di aplikasi lain.']},
{id:'empty',title:'Belum ada pengiriman',group:'',tab:'apps',back:'notifications',content:()=>`<div class="illustration">${icon('bell')}</div><h2 style="text-align:center;font-size:23px;margin:0 0 14px">Mulai dari yang penting.</h2><p style="text-align:center">Pilih aplikasi yang ingin kamu teruskan. Secara default, tidak ada isi notifikasi yang dibagikan.</p>${btn('Pilih aplikasi','apps')}${btn('Coba paket sintetis','diagnostics','secondary')}<div class="notice">Notifikasi yang tidak diizinkan tidak masuk antrean. Riwayat konten tidak disimpan.</div>`,note:'Empty state onboarding; berbeda dengan gangguan koneksi.',accept:['Tidak menyarankan mengaktifkan semua aplikasi.','Paket test sintetis dan opsional.']},
{id:'unknown',title:'Petunjuk belum tersedia',group:'',tab:'navigation',back:'navigation',content:()=>`<div class="card navbig"><div class="row between"><span class="tiny">FORMAT DEMO TIDAK DIKENAL</span>${pill('Data lama','warn')}</div><div style="font-size:80px;color:var(--amber);line-height:1.5">?</div><h2>Arah belum diketahui</h2><div class="small">Jarak tidak tersedia · — m</div></div><div class="notice warn">Belum ada pembaruan dalam 30 detik. Periksa petunjuk asli di Google Maps; robot tidak menebak arah.</div><div class="oledroute">?<span>-- m<br>DATA LAMA</span></div><p class="modalnote">Tampilan berakhir setelah 120 detik tanpa pembaruan.</p>${btn('Buka bantuan navigasi','diagnostics','secondary')}${btn('Hentikan penerusan','home','secondary')} `,note:'Unknown dan stale adalah dua kondisi terpisah; digabung pada contoh untuk memperlihatkan kedua indikator.',accept:['Tidak mengganti unknown dengan lurus atau 0 m.','Jangan memperpanjang TTL saat reconnect.']}
];
function appRow(name,sub,letter,color,on){return `<div class="listrow" data-app-name="${name.toLowerCase()}"><div class="appicon ${color}">${letter}</div><div class="grow linkrow" data-go="appDetail" role="button" tabindex="0"><b>${name}</b><div class="small">${sub}</div></div>${sw('Teruskan '+name,on)}</div>`}
function activityCard(name,sub,shape){return `<div class="card linkrow" data-go="activityDetail" role="button" tabindex="0"><div class="activitypic">${shape}</div><b>${name}</b><p>${sub}</p></div>`}
function nav(tab){const items=[['home','home','Beranda'],['apps','apps','Aplikasi'],['navigation','nav','Navigasi'],['robot','robot','Robot'],['settings','dots','Lainnya']];return `<nav class="bottomnav" aria-label="Navigasi aplikasi">${items.map(([id,ic,label])=>`<button data-go="${id}" class="${tab===id?'active':''}" ${tab===id?'aria-current="page"':''}>${icon(ic)}${label}</button>`).join('')}</nav>`}
function phone(s){const pageTitle=s.id==='appDetail'?'Atur '+selectedApp:s.title;const content=s.id==='appDetail'?s.content().replaceAll('Telegram',selectedApp):s.content();return `<div class="phone"><div class="statusbar"><span>09.41</span><span class="camera"></span><span>▰  ▴  87%</span></div><header class="appheader">${s.back?`<button class="iconbtn" data-go="${s.back}" aria-label="Kembali">${icon('back')}</button>`:''}<div class="grow"><div class="eyebrow">${s.id==='welcome'?'ROBO DESK':'ROBO DESK BRIDGE'}</div><h1>${s.id==='welcome'?'Selamat datang':pageTitle}</h1></div>${!s.back&&s.id!=='welcome'?`<button class="iconbtn" data-go="diagnostics" aria-label="Status koneksi">${icon('bluetooth')}</button>`:''}</header><div class="appcontent">${content}</div>${s.tab?nav(s.tab):''}<div class="gesture"></div></div>`}
function render(id){const s=screens.find(x=>x.id===id);if(!s)return;current=id;document.getElementById('phoneMount').innerHTML=phone(s);document.getElementById('screenTitle').textContent=`${String(screens.indexOf(s)+1).padStart(2,'0')} / ${screens.length} · ${s.title}`;document.getElementById('screenSelect').value=id;document.querySelectorAll('.screen-link').forEach(b=>b.classList.toggle('active',b.dataset.go===id));document.getElementById('inspector').innerHTML=`<span class="reviewtag">USULAN · BELUM DI APK</span><h2>${s.title}</h2><p>${s.note}</p><h3>Perilaku yang ditinjau</h3><ul>${s.accept.map(t=>`<li>${t}</li>`).join('')}</ul><h3>Arah visual</h3><div class="swatches"><i style="background:#050814"></i><i style="background:#00e5ff"></i><i style="background:#a66bff"></i><i style="background:#70dfbb"></i></div><p>Mengikuti dashboard RoboDesk, dengan kartu lebih lembut dan navigasi Android yang familiar.</p><h3>Batas mockup</h3><p>Semua tombol hanya mengubah contoh tampilan. Tidak ada Bluetooth, pembacaan notifikasi, permintaan izin, penyimpanan credential, atau koneksi internet.</p>`;document.title=`${s.title} · RoboDesk UI Mockup`;}
function gallery(){if(!galleryBuilt){document.getElementById('gallery').innerHTML=screens.map((s,i)=>`<section class="gallery-item"><h2>${String(i+1).padStart(2,'0')} · ${s.title}</h2>${phone(s)}</section>`).join('');galleryBuilt=true;}}
function showToast(t){clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');toastTimer=setTimeout(()=>el.classList.remove('show'),3000);}
function view(name){const gal=name==='gallery';if(gal)gallery();document.body.classList.toggle('gallerymode',gal);document.getElementById('galleryBtn').classList.toggle('on',gal);document.getElementById('prototypeBtn').classList.toggle('on',!gal);}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-go]');if(!b)return;if(b.dataset.go){const appRow=b.closest('[data-app-name]');if(appRow&&b.dataset.go==='appDetail')selectedApp=appRow.querySelector('b').textContent;view('prototype');render(b.dataset.go);return;}if(b.dataset.view){view(b.dataset.view);return;}if(b.hasAttribute('data-toggle')){b.setAttribute('aria-checked',String(b.getAttribute('aria-checked')!=='true'));showToast('Simulasi pilihan. Tidak mengubah pengaturan APK atau robot.');return;}if(b.hasAttribute('data-segment')){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));showToast('Pilihan contoh diperbarui.');return;}switch(b.dataset.action){case'theme':document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';break;case'print':gallery();window.print();break;case'pause':paused.value=!paused.value;render('home');showToast(paused.value?'Simulasi: pengiriman dijeda.':'Simulasi: bridge dilanjutkan.');break;default:showToast('Mockup saja. Tindakan ini belum diimplementasikan.');}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-go]')){e.preventDefault();e.target.click();}});
document.addEventListener('input',e=>{if(e.target.hasAttribute('data-filter-apps')){const q=e.target.value.toLowerCase();e.target.closest('.appcontent').querySelectorAll('[data-app-name]').forEach(r=>r.classList.toggle('hide',!r.dataset.appName.includes(q)));}});
document.getElementById('screenSelect').addEventListener('change',e=>render(e.target.value));
document.getElementById('brandIcon').innerHTML=icon('robot');
document.getElementById('rail').innerHTML='<h2>Alur & layar</h2>'+screens.map((s,i)=>(s.group?`<h2>${s.group}</h2>`:'')+`<button class="screen-link" data-go="${s.id}"><span>${String(i+1).padStart(2,'0')}</span>${s.title}</button>`).join('');
document.getElementById('screenSelect').innerHTML=screens.map((s,i)=>`<option value="${s.id}">${i+1}. ${s.title}</option>`).join('');
render('home');
</script>
</body>
</html>
